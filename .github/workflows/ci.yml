name: CI

on:
  pull_request:
  push:
    branches: ['main', 'remote-tiled']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test root app
        run: npm test

      - name: Build root app
        run: npm run build

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Docker Compose smoke test
        run: |
          set -e
          mkdir -p /tmp/tiled-ci-data/sample_scan
          echo '{}' > /tmp/tiled-ci-data/sample_scan/placeholder.json
          export DATA_PATH=/tmp/tiled-ci-data
          docker compose build
          docker compose up -d
          trap 'docker compose logs; docker compose down -v' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/v1/ > /dev/null && \
               curl -sf http://localhost:5174/tomo_viewer/ > /dev/null; then
              echo "Stack is up."
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy in time." >&2
          exit 1

      - name: Install zarr-viewer dependencies
        working-directory: src/zarr-viewer
        run: npm ci

      - name: Typecheck zarr-viewer
        working-directory: src/zarr-viewer
        run: npm run typecheck

      - name: Test zarr-viewer
        working-directory: src/zarr-viewer
        run: npm test

      - name: Build zarr-viewer
        working-directory: src/zarr-viewer
        run: npm run build
