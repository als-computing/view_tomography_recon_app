networks:
  webnet:

services:
  nginx:
    image: nginx:stable
    ports:
      - "5174:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cors.conf:/etc/nginx/cors.conf:ro
    depends_on:
      - tiled
      - react
    restart: unless-stopped
    networks:
      - webnet

  # Public/anonymous directory-serve Tiled (matches README's known-working native recipe). Zarr support
  # is native upstream as of Tiled 0.2.15 (bluesky/tiled#774) - no forked image/build context needed.
  # Folder names under DATA_PATH (sand, petiole, ...) become dataset names directly; no registration step.
  tiled:
    image: ghcr.io/bluesky/tiled:0.2.16
    # --host 0.0.0.0 is required inside a container - tiled's own default (127.0.0.1) would be
    # unreachable from the published port. --public skips API-key auth for reads (writes still need
    # one; tiled auto-generates and prints it in the container logs if ever needed).
    command: tiled serve directory /storage/data --host 0.0.0.0 --port 8000 --public --verbose
    environment:
      # JSON-array string, not space-separated - pydantic-settings' env parsing for this field
      # requires it (confirmed against a known-working hand-run Tiled 0.2.11 container's own env).
      - TILED_ALLOW_ORIGINS=["http://localhost:5174","http://tiled-test:5174"]
    volumes:
      - ${DATA_PATH:-./data}:/storage/data
    ports:
      - "8001:8000"
    restart: unless-stopped
    networks:
      - webnet

  react:
    build:
      context: .
      dockerfile: react/Dockerfile
    expose:
      - "5174"
    restart: unless-stopped
    networks:
      - webnet
