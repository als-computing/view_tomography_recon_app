networks:
  webnet:

services:
  nginx:
    image: nginx:stable
    ports:
      - "8787:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cors.conf:/etc/nginx/cors.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      - tiled
      - viewer
      - vr-viewer
      - react
    restart: unless-stopped
    networks:
      - webnet

  tiled:
    build:
      context: ./tiled
      dockerfile: Dockerfile
    environment:
      - DATA_DIR=/storage/data
      - TILED_ALLOW_ORIGINS="http://localhost:8787 http://localhost:8082 http://localhost:5174 http://localhost:8000 http://localhost:8075 http://host.docker.internal:8787 http://host.docker.internal:8082 http://host.docker.internal:5174 http://host.docker.internal:8075"
      - TILED_SINGLE_USER_API_KEY=${TILED_SINGLE_USER_API_KEY}
      - TILED_CONFIG=/deploy/config/custom_config.yml  # Point to our custom config
    volumes:
      - ${DATA_PATH:-./data}:/storage/data  # Mount data directory
      - ./custom_config.yml:/deploy/config/custom_config.yml  # Mount custom config
    expose:
      - "8000"
    networks:
      - webnet
    
    command: |
      bash -c '
        # 1) Launch the server in the background
        exec tiled serve config --host 0.0.0.0 --port 8000 --scalable & 
        TILED_PID=$!

        # 2) Wait up to 30s for it to become healthy
        sleep 4

        # 3) Register your data once the server is accepting connections
        tiled register http://localhost:8000/ /storage/data --api-key=${TILED_SINGLE_USER_API_KEY} --verbose

        # 4) Monitor the data directory for changes and run register on new files
        # Create a simple watcher script
        echo "#!/bin/bash
        # Create a flag file to track registered zarr files
        touch /tmp/last_register
        
        # Simple infinite loop to check for new files
        while true; do
          # Check if any new zarr files exist
          if find /storage/data -name \"*.zarr\" -type d -newer /tmp/last_register 2>/dev/null | grep -q .; then
            echo \"New zarr files detected, registering...\"
            tiled register http://localhost:8000/ /storage/data --api-key=${TILED_SINGLE_USER_API_KEY} --verbose
            touch /tmp/last_register
          fi
          sleep 10
        done" > /tmp/watcher.sh;
        
        chmod +x /tmp/watcher.sh;
        /tmp/watcher.sh &
        WATCHER_PID=$!;

        # 5) Hand control back to the server process so docker logs still show it
        wait $TILED_PID

      '
    restart: unless-stopped


  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
    expose:
      - "8082"
    networks:
      - webnet
    restart: unless-stopped

  vr-viewer:
    build:
      context: ./vr-viewer
      dockerfile: Dockerfile
    expose:
      - "8083"
    networks:
      - webnet
    restart: unless-stopped

  react:
    build:
      context: .
      dockerfile: react/Dockerfile
    environment:
      - VITE_API_TILED_URL=${VITE_API_TILED_URL:-http://localhost:8000}
    expose:
      - "5174"
    restart: unless-stopped
    networks:
      - webnet